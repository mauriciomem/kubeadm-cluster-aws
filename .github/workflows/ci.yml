name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.6"
  TFLINT_VERSION: "v0.64.0"
  # trivy-action tags were hijacked in March 2026 (CVE-2026-33634), so CI installs a
  # known-good trivy release directly and verifies its checksum.
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

jobs:
  terraform:
    name: fmt, validate, tflint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: terraform test
        run: terraform test

  shellcheck:
    name: render + shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Renders each CNI and topology, because the scripts take different branches.
      - name: render and shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning scripts/*.sh
          for args in "" "-var cni=cilium -var control_plane_count=3 -var worker_count=0"; do
            # shellcheck disable=SC2086 # word splitting of args is intended
            ./scripts/render-templates.sh $args
            shellcheck -S warning build/*.sh
          done

      # Pinned kubeadm checks the rendered init and join configs, including the taints: [] variants.
      - name: kubeadm config validate
        run: ./scripts/validate-kubeadm-config.sh

  trivy:
    name: trivy config (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install trivy
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: trivy config
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
